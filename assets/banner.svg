<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="waveGradient1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="waveGradient2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.5" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    @keyframes barDance1 {
      0%, 100% { height: 16px; y: 280px; }
      50% { height: 56px; y: 240px; }
    }
    @keyframes barDance2 {
      0%, 100% { height: 45px; y: 251px; }
      50% { height: 18px; y: 278px; }
    }
    @keyframes barDance3 {
      0%, 100% { height: 28px; y: 268px; }
      50% { height: 68px; y: 228px; }
    }
    @keyframes waveFloat1 {
      0% { transform: translateX(0px); }
      50% { transform: translateX(-35px); }
      100% { transform: translateX(0px); }
    }
    @keyframes waveFloat2 {
      0% { transform: translateX(0px); }
      50% { transform: translateX(35px); }
      100% { transform: translateX(0px); }
    }
    .wave1 { animation: waveFloat1 8s ease-in-out infinite; }
    .wave2 { animation: waveFloat2 10s ease-in-out infinite; }
    .bar-a { animation: barDance1 1.2s ease-in-out infinite; }
    .bar-b { animation: barDance2 1.5s ease-in-out infinite; }
    .bar-c { animation: barDance3 1.1s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="2" />

  <!-- Background Animated Audio Waves (positioned below so text is never obscured) -->
  <g class="wave1" opacity="0.32">
    <path d="M -100 290 Q 150 215 400 290 T 900 290 T 1400 290 L 1400 360 L -100 360 Z" fill="url(#waveGradient1)" />
  </g>
  <g class="wave2" opacity="0.22">
    <path d="M -100 310 Q 200 245 500 305 T 1000 305 T 1400 310 L 1400 360 L -100 360 Z" fill="url(#waveGradient2)" />
  </g>

  <!-- Dynamic Equalizer Bars in Lower Background -->
  <g opacity="0.45">
    <rect class="bar-a" x="90" y="260" width="8" height="36" rx="4" fill="#38bdf8" />
    <rect class="bar-b" x="106" y="250" width="8" height="46" rx="4" fill="#6366f1" />
    <rect class="bar-c" x="122" y="270" width="8" height="26" rx="4" fill="#a855f7" />
    <rect class="bar-a" x="138" y="245" width="8" height="51" rx="4" fill="#ec4899" />
    <rect class="bar-b" x="154" y="265" width="8" height="31" rx="4" fill="#3b82f6" />
    <rect class="bar-c" x="170" y="255" width="8" height="41" rx="4" fill="#06b6d4" />

    <rect class="bar-b" x="1020" y="255" width="8" height="41" rx="4" fill="#06b6d4" />
    <rect class="bar-a" x="1036" y="265" width="8" height="31" rx="4" fill="#3b82f6" />
    <rect class="bar-c" x="1052" y="245" width="8" height="51" rx="4" fill="#ec4899" />
    <rect class="bar-b" x="1068" y="270" width="8" height="26" rx="4" fill="#a855f7" />
    <rect class="bar-a" x="1084" y="250" width="8" height="46" rx="4" fill="#6366f1" />
    <rect class="bar-c" x="1100" y="260" width="8" height="36" rx="4" fill="#38bdf8" />
  </g>

  <!-- Foreground Category Pills (Static with subtle glow, above dynamic waves) -->
  <g transform="translate(0, 45)">
    <g transform="translate(200, 0)" filter="url(#badgeShadow)">
      <rect width="160" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <text x="80" y="19" fill="#38bdf8" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🎙️ Low Latency Voice</text>
    </g>
    <g transform="translate(380, 0)" filter="url(#badgeShadow)">
      <rect width="180" height="30" rx="15" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" />
      <text x="90" y="19" fill="#818cf8" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Speech-to-Speech</text>
    </g>
    <g transform="translate(580, 0)" filter="url(#badgeShadow)">
      <rect width="170" height="30" rx="15" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" />
      <text x="85" y="19" fill="#c084fc" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🌐 WebRTC Pipelines</text>
    </g>
    <g transform="translate(770, 0)" filter="url(#badgeShadow)">
      <rect width="175" height="30" rx="15" fill="#1e293b" stroke="#34d399" stroke-width="1.2" />
      <text x="87" y="19" fill="#34d399" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🤖 Conversational AI</text>
    </g>
  </g>

  <!-- Foreground Main Title (Guaranteed clear, crisp, prominent foreground) -->
  <g id="title-group">
    <text x="600" y="148" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="40" font-weight="800" text-anchor="middle" fill="url(#textGradient)" filter="url(#glow)" letter-spacing="-0.5">
      Real-Time Voice AI &amp; Conversational Voice
    </text>
    
    <text x="600" y="192" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#94a3b8" letter-spacing="0.2">
      Curated Directory of Low-Latency Voice Agents • Speech-to-Speech • Neural TTS • WebRTC Telephony
    </text>
  </g>

  <!-- Live Pulsing Status Node in Center Foreground -->
  <g transform="translate(600, 240)">
    <circle cx="-165" cy="-1" r="5" fill="#10b981" />
    <circle cx="-165" cy="-1" r="10" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.6">
      <animate attributeName="r" values="5;14;5" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="-145" y="4" fill="#cbd5e1" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="500">
      Continuous Ecosystem Tracking: SaaS Platforms &amp; Star-Ranked Open-Source Projects
    </text>
  </g>
</svg>